version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: sblms-postgres
    environment:
      POSTGRES_DB: SBLMS_Dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SBLMS_Dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: sblms-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=SBLMS_Dev;Username=postgres;Password=postgres
      - Jwt__Key=YourSuperSecretKeyAtLeast32CharactersLong!!
      - Jwt__Issuer=SBLMS
      - Jwt__Audience=SBLMS
    volumes:
      - uploads:/app/Uploads

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: sblms-frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres-data:
  uploads:
